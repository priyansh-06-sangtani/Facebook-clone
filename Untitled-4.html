<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>

    <style>
        body {
            background-color: #fafafa;
            font-family: Arial;
        }

        .box {
            width: 310px;
            margin: 40px auto;
            padding: 35px 25px;
            background-color: white;
            border: 1px solid #ddd;
            text-align: center;
        }

        h1 {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 45px;
        }

        input {
            width: 95%;
            padding: 11px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 3px;
        }

        .login {
            width: 95%;
            padding: 10px;
            margin-top: 6px;
            background-color: #42aeea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .or {
            margin: 22px 0;
            color: #777;
        }

        .facebook {
            margin: 20px;
        }

        .facebook a {
            color: #385898;
            font-weight: bold;
            text-decoration: none;
        }

        .facebook a:hover {
            text-decoration: underline;
        }

        .forgot {
            color: #385898;
            font-size: 13px;
            margin-top: 25px;
        }

        /* App buttons */
        .apps {
            margin-top: 30px;
        }

        .apps p {
            font-size: 13px;
            color: #555;
        }

        .app-btn {
            display: inline-block;
            padding: 8px 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: black;
            color: white;
            text-decoration: none;
            font-size: 12px;
        }

        .app-btn:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Instagram</h1>

        <input type="text"
               placeholder="Phone number, username, or email">

        <input type="password"
               placeholder="Password">

        <button class="login">Log in</button>

        <div class="or">
            ─────── &nbsp; OR &nbsp; ───────
        </div>

        <!-- Clickable Facebook Link -->
        <div class="facebook">
            🟦
            <a href="C:\Users\HP\OneDrive\Desktop\facebook.html" target="_blank">
                Log in with Facebook
            </a>
        </div>

        <div class="forgot">
            Forgot password?
        </div>


        <!-- App Download Buttons -->
        <div class="apps">

            <p>Get the app.</p>

            <a class="app-btn"
               href="https://play.google.com/"
               target="_blank">
                ▶ Google Play
            </a>

            <a class="app-btn"
               href="https://apps.microsoft.com/"
               target="_blank">
                ⊞ Microsoft
            </a>

        </div>

    </div>

</body>
</html>4
