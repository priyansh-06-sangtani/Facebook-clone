<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>

    <style>
        body {
            margin: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chess-board {
            width: 400px;
            height: 400px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 4px solid #c8755f;
        }

        .square {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
        }

        .light {
            background-color: #f5d9c9;
        }

        .dark {
            background-color: #c8755f;
        }

        .piece {
            color: #111;
            font-family: "Times New Roman", serif;
        }

        .white-piece {
            color: white;
            text-shadow:
                1px 1px 1px #000,
                -1px -1px 1px #000,
                1px -1px 1px #000,
                -1px 1px 1px #000;
        }
    </style>
</head>

<body>

<div class="chess-board">

    <!-- Black pieces -->
    <div class="square light piece">♜</div>
    <div class="square dark piece">♞</div>
    <div class="square light piece">♝</div>
    <div class="square dark piece">♛</div>
    <div class="square light piece">♚</div>
    <div class="square dark piece">♝</div>
    <div class="square light piece">♞</div>
    <div class="square dark piece">♜</div>

    <div class="square dark piece">♟</div>
    <div class="square light piece">♟</div>
    <div class="square dark piece">♟</div>
    <div class="square light piece">♟</div>
    <div class="square dark piece">♟</div>
    <div class="square light piece">♟</div>
    <div class="square dark piece">♟</div>
    <div class="square light piece">♟</div>

    <!-- Empty squares -->
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>

    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>

    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>

    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>

    <!-- White pieces -->
    <div class="square light white-piece">♙</div>
    <div class="square dark white-piece">♙</div>
    <div class="square light white-piece">♙</div>
    <div class="square dark white-piece">♙</div>
    <div class="square light white-piece">♙</div>
    <div class="square dark white-piece">♙</div>
    <div class="square light white-piece">♙</div>
    <div class="square dark white-piece">♙</div>

    <div class="square dark white-piece">♖</div>
    <div class="square light white-piece">♘</div>
    <div class="square dark white-piece">♗</div>
    <div class="square light white-piece">♕</div>
    <div class="square dark white-piece">♔</div>
    <div class="square light white-piece">♗</div>
    <div class="square dark white-piece">♘</div>
    <div class="square light white-piece">♖</div>

</div>

</body>
</html>
