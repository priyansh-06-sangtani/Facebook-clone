<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>

    <style>
        body {
            background-color: #fafafa;
            font-family: Arial;
        }

        .box {
            width: 310px;
            margin: 40px auto;
            padding: 35px 25px;
            background-color: white;
            border: 1px solid #ddd;
            text-align: center;
        }

        h1 {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 45px;
        }

        input {
            width: 95%;
            padding: 11px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 3px;
        }

        .login {
            width: 95%;
            padding: 10px;
            margin-top: 6px;
            background-color: #42aeea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .or {
            margin: 22px 0;
            color: #777;
        }

        .facebook {
            color: #385898;
            font-weight: bold;
            margin: 20px;
        }

        .forgot {
            color: #385898;
            font-size: 13px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Instagram</h1>

        <input type="text"
               placeholder="Phone number, username, or email">

        <input type="password"
               placeholder="Password">

        <button class="login">Log in</button>

        <div class="or">
            ───────── &nbsp; OR &nbsp; ─────────
        </div>

        <div class="facebook">
            🟦 &nbsp; Log in with Facebook
        </div>

        <div class="forgot">
            Forgot password?
        </div>

    </div>

</body>
</html>
