<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess the Number</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #666;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 15px 0;

            border: 2px solid #ddd;
            border-radius: 8px;

            font-size: 18px;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background-color: #667eea;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #5568d9;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .attempts {
            margin-top: 15px;
            color: #555;
        }

        .reset {
            margin-top: 12px;
            background-color: #333;
        }

        .reset:hover {
            background-color: #222;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>🎯 Guess the Number</h1>

        <p>
            I have selected a number between <b>1 and 100</b>.
            Can you guess it?
        </p>

        <input
            type="number"
            id="guess"
            placeholder="Enter your guess"
            min="1"
            max="100"
        >

        <button onclick="checkGuess()">
            Guess
        </button>

        <div id="message"></div>

        <div class="attempts">
            Attempts: <span id="attemptCount">0</span>
        </div>

        <button class="reset" onclick="resetGame()">
            New Game
        </button>

    </div>


    <script>

        let randomNumber = Math.floor(Math.random() * 100) + 1;

        let attempts = 0;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);

            let message = document.getElementById("message");

            if (guess < 1 || guess > 100 || guess === 0) {
                message.innerHTML = "⚠️ Please enter a number between 1 and 100.";
                message.style.color = "orange";
                return;
            }

            attempts++;

            document.getElementById("attemptCount").innerHTML = attempts;

            if (guess === randomNumber) {

                message.innerHTML =
                    "🎉 Correct! You guessed the number!";

                message.style.color = "green";

            } 
            else if (guess < randomNumber) {

                message.innerHTML =
                    "📈 Too low! Try a higher number.";

                message.style.color = "red";

            } 
            else {

                message.innerHTML =
                    "📉 Too high! Try a lower number.";

                message.style.color = "red";

            }

            document.getElementById("guess").value = "";
        }


        function resetGame() {

            randomNumber = Math.floor(Math.random() * 100) + 1;

            attempts = 0;

            document.getElementById("attemptCount").innerHTML = "0";

            document.getElementById("message").innerHTML = "";

            document.getElementById("guess").value = "";
        }

    </script>

</body>
</html>
